<!DOCTYPE html>

<html>
	<head>
		<title>Hello</title>
	</head>
	
	<body>
		<form action="save_user" method="post">
				<table>
					<tr>
						<th align="left">
							<label for="un">User Name:</label>
						</th> 
					</tr>
					<tr>
						<td><input type="text" name="name" id="un"></td>
					</tr>
					
					<tr>
						<th align="left">
							<label for="em">Email:</label>
						</th> 
					</tr>
					
					<tr>
						<td><input type="email" name="email" id="em"></td>
					</tr>
					
					<tr>
						<th align="left">
							<label for="ph">Phone:</label>
						</th> 
					</tr>
					
					<tr>
						<td><input type="tel" name="phone" id="ph"></td>
					</tr>
					
					<tr>
						<th align="left">
							<label for="cn">Country:</label>
						</th> 
					</tr>
					
					<tr>
						<td><input type="text" name="country" id="cn"></td>
					</tr>
					
					<tr align="center">
						<td><input type="submit" value="Save User"></td>
					</tr>
				</table>
		</form>
	</body>
</html>
