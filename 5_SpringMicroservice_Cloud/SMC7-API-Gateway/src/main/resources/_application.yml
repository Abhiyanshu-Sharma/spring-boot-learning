spring:
  application:
    name: SMC7-API-Gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: api-1
            uri: lb://SMC7-M1
            predicates:
            - Path=/pro,/info
          - id: api-2
            uri: lb://SMC7-M2
            predicates:
            - Path=/act
server:
  port: 2222
