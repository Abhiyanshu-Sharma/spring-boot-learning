<!DOCTYPE html>
	<head>
		<title>All Todos Page</title>
	</head>
	
	<body>
		<h1>All ToDos</h1>
		
		<hr>
		
		<table border="1" align="center">
			<thead>
				<tr>
					<th>Id</th>
					<th>User Id</th>
					<th>Title</th>
					<th>Completed</th>
				</tr>
			</thead>
			
			<tbody>
				<tr th:each="todo : ${todos}">
				    <td th:text="${todo.id}"></td>
				    <td th:text="${todo.userId}"></td>
				    <td th:text="${todo.title}"></td>
				    <td th:text="${todo.completed}"></td>
				</tr>
			</tbody>
		</table>
	</body>

</html>
